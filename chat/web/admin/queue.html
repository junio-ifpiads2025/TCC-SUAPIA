{% extends "base.html" %}
{% block title %}Fila{% endblock %}
{% block content %}
<h1 class="h3 page-title mb-4">Fila de atendimento</h1>
<ul class="nav nav-pills mb-3 gap-1">
  <li class="nav-item"><a class="nav-link {{ 'active' if which == 'pending' }}" href="/admin/queue?which=pending">Pendentes <span class="badge text-bg-light">{{ counts.pending }}</span></a></li>
  <li class="nav-item"><a class="nav-link {{ 'active' if which == 'processing' }}" href="/admin/queue?which=processing">Em atendimento <span class="badge text-bg-light">{{ counts.processing }}</span></a></li>
  <li class="nav-item"><a class="nav-link {{ 'active' if which == 'failed' }}" href="/admin/queue?which=failed">Falhas <span class="badge text-bg-danger">{{ counts.failed }}</span></a></li>
  <li class="nav-item"><a class="nav-link {{ 'active' if which == 'done' }}" href="/admin/queue?which=done">Atendidas <span class="badge text-bg-success">{{ counts.done }}</span></a></li>
</ul>
<div class="card">
  <div id="queue-table"
       hx-get="/admin/queue/table?which={{ which }}"
       hx-trigger="every 5s"
       hx-swap="innerHTML">
    {% include "_queue_table.html" %}
  </div>
</div>
{% endblock %}
