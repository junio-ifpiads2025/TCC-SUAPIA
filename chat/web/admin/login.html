<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · SUAP-IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%); }
    .login-card { width: 100%; max-width: 380px; border: 0; border-radius: 1rem; }
    .logo { width: 3.5rem; height: 3.5rem; border-radius: 1rem; background: #1d4ed8; color: #fff; display: grid; place-items: center; font-size: 1.8rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <form method="post" action="/admin/login" class="card login-card shadow-lg p-4">
    <div class="d-flex flex-column align-items-center mb-4">
      <div class="logo mb-3"><i class="bi bi-robot"></i></div>
      <h1 class="h4 mb-0">SUAP-IA</h1>
      <span class="text-body-secondary small">Painel administrativo</span>
    </div>
    {% if error %}<div class="alert alert-danger py-2 small" role="alert"><i class="bi bi-exclamation-triangle me-1"></i>{{ error }}</div>{% endif %}
    <div class="form-floating mb-3">
      <input class="form-control" id="username" name="username" placeholder="Usuário" autocomplete="username" required autofocus>
      <label for="username">Usuário</label>
    </div>
    <div class="form-floating mb-4">
      <input class="form-control" id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
      <label for="password">Senha</label>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
  </form>
</body>
</html>
