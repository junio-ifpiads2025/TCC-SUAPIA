<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{AGENT_NAME}} — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo h1 { font-size: 1.6rem; color: #1a56db; }
    .logo p  { color: #6b7280; font-size: .9rem; margin-top: .25rem; }

    label { display: block; font-size: .875rem; font-weight: 600; color: #374151; margin-bottom: .35rem; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: .65rem .9rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1rem;
    }
    input:focus { border-color: #1a56db; }
    input.error { border-color: #ef4444; }

    .field-error { color: #ef4444; font-size: .8rem; margin-top: -.75rem; margin-bottom: .75rem; }

    button[type="submit"] {
      width: 100%;
      padding: .75rem;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button[type="submit"]:hover { background: #1e40af; }
    button[type="submit"]:disabled { background: #93c5fd; cursor: not-allowed; }

    .notice {
      margin-top: 1.25rem;
      font-size: .8rem;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>{{AGENT_NAME}}</h1>
      <p>Assistente virtual do SUAP — IFPI</p>
    </div>

    <form id="login-form" method="POST" action="/auth/login?token={{TOKEN}}" novalidate>
      <label for="matricula">Matrícula</label>
      <input type="text" id="matricula" name="matricula" placeholder="Ex: 20221XXXXX" autocomplete="username" />
      <div class="field-error" id="err-matricula"></div>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" />
      <div class="field-error" id="err-senha"></div>

      <button type="submit" id="btn-submit">Entrar</button>
    </form>

    <p class="notice">Este link expira em 15 minutos. Após o login, volte ao WhatsApp.</p>
  </div>

  <script>
    const form = document.getElementById('login-form');

    form.addEventListener('submit', function (e) {
      let valid = true;

      const matricula = document.getElementById('matricula');
      const senha = document.getElementById('senha');
      const errMat = document.getElementById('err-matricula');
      const errSen = document.getElementById('err-senha');

      matricula.classList.remove('error');
      senha.classList.remove('error');
      errMat.textContent = '';
      errSen.textContent = '';

      if (!matricula.value.trim()) {
        matricula.classList.add('error');
        errMat.textContent = 'Informe a matrícula.';
        valid = false;
      }

      if (!senha.value) {
        senha.classList.add('error');
        errSen.textContent = 'Informe a senha.';
        valid = false;
      }

      if (!valid) {
        e.preventDefault();
        return;
      }

      document.getElementById('btn-submit').disabled = true;
      document.getElementById('btn-submit').textContent = 'Entrando…';
    });
  </script>
</body>
</html>
