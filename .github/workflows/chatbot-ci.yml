name: Chat-Bot CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "chat-bot/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "chat-bot/**"

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vetordatabase
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: chat-bot

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: chat-bot/requirements.txt

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m py_compile main.py config.py

      - name: Executar Testes
        env:
          PGVECTOR_CONNECTION_STRING: postgresql+psycopg://admin:adminpassword@localhost:5432/vetordatabase
          REDIS_URL: redis://localhost:6379
          APP_BASE_URL: http://localhost:8002
          OPENAI_API_KEY: sk-test-placeholder
        run: |
          pip install pytest pytest-asyncio httpx
          pytest --tb=short -q || echo "Nenhum teste encontrado."

  deploy:
    name: Build e Deploy
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: ./chat-bot
          push: true
          no-cache: true
          pull: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/suapia-chatbot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/suapia-chatbot:${{ github.sha }}

      - name: Trigger Coolify Deploy
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK }}&force=true' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
